name: Fix Smart Cleaner credentialed CORS
on:
  push:
    paths:
      - '.github/workflows/fix-cleaner-cors-20260815.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch CORS
        shell: python
        run: |
          from pathlib import Path
          p=Path('backend/server.py')
          s=p.read_text()
          old='''app.add_middleware(\n    CORSMiddleware,\n    allow_credentials=True,\n    allow_origins=["*"],\n    allow_methods=["*"],\n    allow_headers=["*"],\n)'''
          new='''app.add_middleware(\n    CORSMiddleware,\n    allow_credentials=True,\n    allow_origins=[\n        "https://cleaner.raven-sharp.com",\n        "https://raven-sharp-smart-ai-cleaner-production.up.railway.app",\n        "http://localhost:3000",\n        "http://127.0.0.1:3000",\n    ],\n    allow_origin_regex=r"https://.*\\.raven-sharp\\.com",\n    allow_methods=["*"],\n    allow_headers=["*"],\n)'''
          if old not in s:
              raise SystemExit('CORS marker missing')
          p.write_text(s.replace(old,new,1))
      - name: Verify
        run: python -m py_compile backend/server.py
      - name: Commit
        run: |
          git config user.name 'Raven Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/server.py
          git diff --cached --quiet || (git commit -m 'Fix credentialed CORS for Smart Cleaner' && git push)
