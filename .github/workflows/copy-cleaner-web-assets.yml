name: Copy Smart Cleaner web assets to monorepo branch
on:
  push:
    branches:
      - consolidate-web-into-monorepo-20261014
    paths:
      - .github/workflows/copy-cleaner-web-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy public source assets
        run: |
          set -euo pipefail
          mkdir -p web/brands
          for name in adgDownloads.png myCalcTools.png ravenCentre-v2.png ravenCentre.png ravenSharpLogo.png spewCrew.png wheelNamePicker.png; do
            curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/nightowlhoothoot83-create/Raven-Sharp-Smart-Cleaner-Web/main/brands/$name" -o "web/brands/$name"
            test -s "web/brands/$name"
          done
      - name: Commit assets on migration branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/brands/
          if ! git diff --cached --quiet; then
            git commit -m "Copy Smart Cleaner web brand assets"
            git push
          fi
